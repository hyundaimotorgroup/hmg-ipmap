# ──────────────────────────────────────────────────────────────────────────────
# Gradle JVM Arguments
#
# --enable-native-access=ALL-UNNAMED
#   Required for libraries using Foreign Function & Memory (FFM) API
#   and to suppress Gradle native-platform warnings on Java 25+
#
# --sun-misc-unsafe-memory-access=allow
#   Suppresses terminal deprecation warnings from sun.misc.Unsafe
#   caused by net.openhft:zero-allocation-hashing using UnsafeAccess internally
#   Will be BLOCKED in Java 26 — migrate library before upgrading JDK
# ──────────────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=\
  -Xmx3g \
  --enable-native-access=ALL-UNNAMED \
  --sun-misc-unsafe-memory-access=allow
