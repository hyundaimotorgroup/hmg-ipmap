spring.application.name=hmg-ipmap-api
spring.profiles.active=local
app.version=1.0.0

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5m

#DATABASE START
spring.datasource.url=jdbc:postgresql://localhost:5432/ipmap
spring.datasource.username=app_user
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
#DATABASE END

# Logger
logging.file.name=logs/app.log

# Valkey server configRedis
spring.data.redis.host=localhost
#spring.data.redis.password=yourpassword
spring.data.redis.port=6379
spring.data.redis.timeout=6000


redisson.mode=single
redisson.address=redis://localhost:6379
redisson.cluster.nodes=redis://localhost:6379,redis://localhost:6379,redis://localhost:6379
#redisson.password=yourpassword

# Enable Redis caching
spring.cache.type=redis

# Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
# Use REPEATABLE_READ instead of SERIALIZABLE to avoid 40001 serialization failures
# when multiple instances concurrently insert into BATCH_JOB_EXECUTION.
spring.batch.jdbc.isolation-level-for-create=REPEATABLE_READ
app.ingestion.upload.folder=/app/upload
app.ingestion.upload.insert-batch-size=10000
app.ingestion.zip.threshold.entries=20
app.ingestion.zip.threshold.size=1GB
app.ingestion.zip.threshold.ratio=10
app.ingestion.zip.threshold.entry-size=500MB
app.ingestion.location.chunk-size=500
app.ingestion.ip-block.chunk-size=300

app.data-provider=default

# Multi-instance location-phase coordination (LocationCoordinationTasklet / MarkLocationPhaseCompletedTasklet)
# How long a follower instance waits for the leader to finish the location phase before timing out
app.ingestion.location-phase.await-timeout=4h
# How often a follower polls Redis for the location-phase done flag (milliseconds)
app.ingestion.location-phase.poll-interval=5s
# TTL of the leader lock. Kept short so a crashed leader is detected quickly.
# LocationPhaseLeaderHeartbeat renews this after every chunk, so the lock never expires
# while the leader JVM is alive. Must be safely longer than the worst-case time between
# two consecutive chunk completions (chunk processing time + inter-step transition overhead).
# Recovery window after a leader crash = lock-ttl + poll-interval (i.e. ~35 s at defaults).
app.ingestion.location-phase.lock-ttl=30s
# TTL of the Redis done flag set after the location phase completes
app.ingestion.location-phase.done-key-ttl=6h

# ApplicationTaskExecutor
app.async.application-task-executor.core-pool-size=10
app.async.application-task-executor.max-pool-size=50
app.async.application-task-executor.queue-capacity=100
# FileImportTaskExecutor
app.async.file-import-task-executor.core-pool-size=2
app.async.file-import-task-executor.max-pool-size=4
app.async.file-import-task-executor.queue-capacity=10
#JobRunnerTaskExecutor
app.async.job-runner-task-executor.core-pool-size=2
app.async.job-runner-task-executor.max-pool-size=4
app.async.job-runner-task-executor.queue-capacity=10

# Multi-instance batch polling scheduler
# How often each instance polls for IN_PROGRESS jobs it is not yet participating in (milliseconds)
app.ingestion.polling.fixed-delay=30000
# How long a row can stay IN_PROGRESS without an update before it is considered orphaned
# and reset to INIT (seconds). Should be comfortably longer than the longest expected chunk time.
app.ingestion.polling.orphan-timeout=600s

cache-sync.job.enabled=true
cache-sync.job.fixed-delay=30000
cache-sync.job.lock.wait-time=1s
cache-sync.job.lock.lease-time=30s
cache-sync.job.batch-size=500

# whole project using snake case
spring.jackson.property-naming-strategy=SNAKE_CASE

# tomcat server
server.tomcat.connection-timeout=60s

# log access configuration
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/app/log
server.tomcat.accesslog.prefix=hmg-ipmap-access.
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.file-date-format=yyyy-MM-dd
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b "%{Referer}i" "%{User-Agent}i" %Dms


# Caffeine Cache Configuration (local in-memory cache)
cache.caffeine.enabled=true
cache.caffeine.max-size=100000
cache.caffeine.initial-capacity=1000
cache.caffeine.expire-after-write=5m
cache.caffeine.ip-location-enabled=true

# Cache Fetch Pagination Configuration
cache.fetch.pagination.size=1000

constant.admin.id=1

# IP Span Rebuild
app.ip-span.subnet-prefix-length=20
app.ip-span.rebuild.chunk-size=100

# =============================================================
# Application Info
# =============================================================
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true

info.app.name=@project_name@
info.app.version=@project_version@
info.app.description=HMG IPMAP API Service
info.app.env=${APP_ENV:dev}

# =============================================================
# Actuator Endpoints
# =============================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator

# =============================================================
# Health
# =============================================================
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# =============================================================
# Prometheus
# =============================================================
management.prometheus.metrics.export.enabled=true

# Aggregation step interval for Prometheus metrics
# Micrometer buffers raw metric events and aggregates them every <step>
# IMPORTANT: Must match or be a divisor of Telegraf scrape interval (60s)
#   - step=60s + Telegraf interval=60s → metrics align perfectly
management.prometheus.metrics.export.step=60s


management.prometheus.metrics.export.descriptions=true

# =============================================================
# Global Metric Tags
# =============================================================
management.metrics.tags.application=${spring.application.name}